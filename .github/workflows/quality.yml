name: Quality

on:
  pull_request:
  # A merge queue tests each PR against the real tip of the target branch (plus
  # whatever is queued ahead of it) on a temporary branch, and merges only if
  # THAT is green. Without this trigger the checks never start on that branch:
  # the queue waits, times out, and evicts the pull request.
  merge_group:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run knip

      - run: bun run format:check

      - run: bun run typecheck

      - run: bun run build

      - run: bun run test:coverage

      - run: bunx publint packages/cli

      - run: bunx publint packages/contract
