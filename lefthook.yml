pre-commit:
  commands:
    secrets:
      run: gitleaks protect --staged --redact
    format:
      glob: '*'
      # --cache is free here and occasionally not: a rebase or a checkout
      # restages files prettier has already seen unchanged.
      run: bunx prettier --write --cache --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      # Staged files only, though oxlint scans the whole repo in 0.3s: the point
      # is not the time, it is that a commit must not be blocked by a warning
      # sitting in a file it does not touch. `bun run lint` in CI owns the repo.
      glob: '*.{ts,mjs,vue}'
      run: bunx oxlint {staged_files}

commit-msg:
  commands:
    commitlint:
      # Conventional Commits, cf. commitlint.config.mjs pour les deux écarts au
      # preset et pour les commits que le task runner génère lui-même.
      run: bunx commitlint --edit {1}

pre-push:
  # Two phases. packages/contract/dist is built ONCE up front: both the
  # typecheck and the test run need it, and two concurrent `build:contract`
  # would race on the same output directory. Everything after that is
  # independent, so it runs concurrently — the hook costs roughly what its
  # slowest job costs instead of the sum of all four.
  #
  # The jobs below call the `:only` scripts on purpose: they are the build-free
  # halves, and the build has already happened in the first phase.
  piped: true
  jobs:
    - name: build-contract
      run: bun run build:contract
    - group:
        parallel: true
        jobs:
          - name: secrets
            # Le pre-commit ne voit que l'index : un secret arrivé par un commit non
            # passé par le hook (--no-verify, rebase, cherry-pick, commit d'un autre
            # outil) ne serait rattrapé par rien avant la forge. On scanne donc ici
            # ce qui est sur le point de partir, borné aux commits non poussés :
            # l'historique antérieur a déjà été scanné aux pushs précédents et un
            # full-scan croît avec le dépôt. Repli sur le full-scan quand la branche
            # n'a pas encore d'upstream (premier push, `@{push}` irrésolu).
            run: |
              if remote_head="$(git rev-parse '@{push}' 2>/dev/null)"; then
                gitleaks git --no-banner --redact --log-opts="$remote_head..HEAD" .
              else
                gitleaks git --no-banner --redact .
              fi
          - name: typecheck
            run: bun run typecheck:only
          - name: knip
            run: bun run knip
          - name: test
            # The whole suite in parallel (21s here, against 66s serial), with a
            # deadline and a serial retry around the intermittent --parallel
            # hang. scripts/pre-push-tests.mjs carries the measurements and the
            # reasoning. The coverage gate stays in CI.
            #
            # git exports its repo-location vars (GIT_DIR, GIT_WORK_TREE, ...) to
            # the hooks it runs; the test suite spawns git inside throwaway
            # tmpdirs, and those inherited vars would silently redirect every one
            # of these git calls to the real repository (test branches, commits
            # and config land in the repo you are pushing from). Strip them
            # before running the tests — same doctrine as subprocessEnv in
            # packages/cli/src/git.ts.
            run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_PREFIX -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_QUARANTINE_PATH bun scripts/pre-push-tests.mjs
