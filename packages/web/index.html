<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>codesema</title>
    <script>
      try {
        var root = document.documentElement
        var palette = localStorage.getItem('codesema-palette')
        // Previous default shipped as tokyonight; its bare :root is now Ink.
        // Migrate once so first paint matches without fighting a stale key.
        if (palette === 'tokyonight' && !localStorage.getItem('codesema-palette-migrated-ink')) {
          localStorage.setItem('codesema-palette', 'ink')
          localStorage.setItem('codesema-palette-migrated-ink', '1')
          palette = 'ink'
        }
        if (palette && palette !== 'ink') root.dataset.palette = palette
        if (localStorage.getItem('codesema-contrast') === 'aaa') root.dataset.contrast = 'aaa'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
